<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>"boxit.co"</title>
    <link rel="icon" type="image/x-icon" href="gay.ico">
</head>
<body>

    <!-- The Anti-Tamper Security Banner -->
    <div id="sec-banner">
        ⚠️ INSPECT / TAMPER DETECTED ⚠️
        <div style="font-size: 1.2rem; color: #fff; margin-top: 20px;">Restricted Environment Protected</div>
    </div>

    <!-- Jumpscare Screen -->
    <div id="jumpscare-overlay">👁️⚡👁️</div>

    <div class="protected-box" id="main-content">
        <h1>Protected Media Workspace</h1>
        <p>Try opening the Inspect tool or deleting elements in the DOM...</p>
    </div>

    <script>
        const banner = document.getElementById('sec-banner');
        const jumpscare = document.getElementById('jumpscare-overlay');
        let bannerState = false;

        // 1. The JS Script that forces a state change every 500ms, 
        // fighting anyone trying to permanently hide or delete the banner via CSS/DOM.
        setInterval(() => {
            bannerState = !bannerState;
            if (bannerState) {
                banner.classList.add('active');
            } else {
                banner.classList.remove('active');
            }
        }, 500);

        // 2. Anti-Tamper / DevTools Trigger (MutationObserver + Debugger Trap)
        let triggered = false;

        function triggerJumpscareAndReload() {
            if (triggered) return;
            triggered = true;

            // Show jumpscare screen
            jumpscare.style.display = 'flex';

            // Optional: Play a synthetic beep/shock sound using Web Audio API
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}

            // Send them back to the same HTML file after a brief flash
            setTimeout(() => {
                window.location.href = window.location.href;
            }, 800);
        }

        // Watch if anyone tries to delete the main container or banner in DevTools
        const observer = new MutationObserver((mutations) => {
            for (let mutation of mutations) {
                if (mutation.removedNodes.length > 0) {
                    mutation.removedNodes.forEach(node => {
                        if (node.id === 'main-content' || node.id === 'sec-banner') {
                            triggerJumpscareAndReload();
                        }
                    });
                }
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // DevTools execution pause detector (Triggers jumpscare if someone opens Inspect and hits a breakpoint)
        setInterval(() => {
            const start = performance.now();
            debugger; // Freezes execution if DevTools is open
            if (performance.now() - start > 100) {
                triggerJumpscareAndReload();
            }
        }, 1000);
    </script>
</body>
</html>
</body>
</html>
